name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project WeatherFront.xcodeproj \
            -scheme WeatherFront \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeatherFront.app Payload/
          zip -r WeatherFront.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherFront-ipa
          path: WeatherFront.ipa
